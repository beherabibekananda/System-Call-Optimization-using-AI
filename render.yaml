services:
  - type: web
    name: syscall-ai-dashboard
    env: docker
    region: ohio
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: syscall-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PORT
        value: "8000"

databases:
  - name: syscall-ai-db
    region: ohio
    databaseName: syscall_ai
    user: syscall_admin
    plan: free
